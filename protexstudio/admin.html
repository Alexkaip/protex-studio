<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Protex Online Admin</title>
  <link rel="stylesheet" href="style.css">
  <style>
    /* Styling für das Kategorien-Modal */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.6);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      backdrop-filter: blur(4px);
    }
    .modal-overlay.hidden {
      display: none;
    }
    .modal-card {
      background: white;
      padding: 28px;
      border-radius: 16px;
      width: 90%;
      max-width: 500px;
      box-shadow: 0 12px 40px rgba(0,0,0,0.2);
      position: relative;
      max-height: 90vh;
      overflow-y: auto;
    }
    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      border-bottom: 1px solid #eee;
      padding-bottom: 12px;
    }
    .modal-header h2 {
      margin: 0;
      font-size: 1.4rem;
      color: #111;
    }
    .close-btn {
      background: none;
      border: none;
      font-size: 2.2rem;
      cursor: pointer;
      color: #aaa;
      line-height: 1;
      padding: 0 4px;
      transition: color 0.2s;
    }
    .close-btn:hover {
      color: #333;
    }
    /* Kategorien-Button standardmäßig ausblenden */
    #open-categories-btn {
      display: none;
    }
    /* Kategorien-Button nur anzeigen, wenn der Admin-Bereich sichtbar ist */
    body:has(#admin-area:not(.hidden)) #open-categories-btn {
      display: inline-block;
    }
    /* Vertikal gestapeltes Layout statt Spalten nebeneinander */
    .admin-layout {
      display: flex !important;
      flex-direction: column !important;
      gap: 24px !important;
    }
    /* Header Button Row Fix */
    .header-btn-row {
      display: flex !important;
      gap: 10px;
      justify-content: flex-end;
      align-items: center;
      flex-wrap: wrap;
      min-width: 380px;
    }
    .header-btn-row .btn {
      margin: 0 !important;
    }
    /* Modal Styling Verbesserungen */
    .modal-card input[type=text] {
      width: 100% !important;
      padding: 12px 14px !important;
      font-size: 1rem !important;
      border-radius: 10px !important;
      border: 1px solid #cbd5e1 !important;
      margin-bottom: 12px !important;
      box-sizing: border-box !important;
    }
    .modal-card button.btn {
      width: 100% !important;
      padding: 12px !important;
      font-size: 1rem !important;
      font-weight: 600 !important;
      border-radius: 10px !important;
      margin: 0 !important;
      box-sizing: border-box !important;
      background: #2563eb !important;
      color: white !important;
      border: none !important;
      cursor: pointer !important;
      transition: background 0.2s !important;
    }
    .modal-card button.btn:hover {
      background: #1d4ed8 !important;
    }
    /* Kategorien-Chips */
    .category-chip {
      background: #eff6ff !important;
      color: #1e40af !important;
      border: 1px solid #bfdbfe !important;
      padding: 6px 14px !important;
      border-radius: 20px !important;
      font-weight: 600 !important;
      font-size: 0.9rem !important;
    }
    /* Kategorien-Überschrift in der Admin-Produktliste */
    .admin-category-header {
      font-size: 1.15rem;
      font-weight: 800;
      color: #1e293b;
      background: #f8fafc;
      padding: 8px 14px;
      border-radius: 8px;
      margin-top: 24px;
      margin-bottom: 10px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      border-left: 4px solid #2563eb;
      box-shadow: inset 0 0 0 1px rgba(0,0,0,0.035);
    }
    .admin-category-header:first-of-type {
      margin-top: 10px;
    }
  </style>
</head>
<body>
<header class="header container">
  <div>
    <div class="brand">Protex Online Admin</div>
    <div class="sub">Produkte & Kategorien live pflegen</div>
  </div>
  <div class="header-btn-row">
    <button class="btn btn-secondary" id="open-categories-btn" type="button">📂 Kategorien verwalten</button>
    <a class="btn btn-light" href="index.html">Kundenansicht</a>
    <button class="btn btn-secondary" id="logout-btn" type="button">Logout</button>
  </div>
</header>
<main class="container">
  <div id="config-warning" class="notice warn hidden"></div>
  <section id="login-card" class="card" style="max-width:460px;margin:40px auto;">
    <h1>Admin Login</h1>
    <div class="form-group"><label>E-Mail</label><input type="email" id="login-email"></div>
    <div class="form-group"><label>Passwort</label><input type="password" id="login-password"></div>
    <button class="btn" id="login-btn" type="button">Einloggen</button>
    <div id="login-status" class="sub" style="margin-top:10px"></div>
  </section>
  <section id="admin-area" class="admin-layout hidden">
    <div class="card">
      <h2 id="form-title">Produkt anlegen</h2>
      <input type="hidden" id="edit-id">
      <div class="form-group"><label>Produktname</label><input type="text" id="p-title"></div>
      <div class="form-group"><label>Kategorie</label><select id="p-category"></select></div>
      <div class="form-group"><label>Beschreibung</label><textarea id="p-desc" rows="3"></textarea></div>
      <div class="form-group"><label>Preis</label><input type="text" id="p-price"></div>
      <div class="form-group"><label>Größen</label><input type="text" id="p-sizes" value="S,M,L,XL,XXL"></div>
      <div class="form-group"><label>Bild Vorderseite</label><input type="file" id="p-front" accept="image/*"></div>
      <div class="form-group"><label>Bild Rückseite</label><input type="file" id="p-back" accept="image/*"></div>
      <div class="form-group"><label><input type="checkbox" id="p-active" checked> Aktiv</label></div>
      <div class="btn-row"><button class="btn" id="save-product-btn" type="button">Speichern</button><button class="btn btn-light" id="reset-form-btn" type="button">Neu</button></div>
      <div id="save-status" class="sub"></div>
      
      <h2 style="margin-top: 30px;">CSV Import/Export</h2>
      <div class="form-group"><label>CSV importieren</label><input type="file" id="csv-import" accept=".csv,text/csv"></div>
      <div class="btn-row"><button class="btn btn-secondary" id="csv-export-btn" type="button">Export</button></div>
      <div class="notice warn">CSV importiert Daten. Bilder bitte danach beim Produkt hochladen.</div>
    </div>
    <div class="card">
      <h2>Produkte</h2>
      <div class="btn-row"><input type="text" id="search" placeholder="Suchen..."><button class="btn btn-light" id="reload-btn" type="button">Neu laden</button></div>
      <div id="product-list" class="product-list"></div>
    </div>
  </section>
</main>

<!-- Modal for categories -->
<div id="categories-modal" class="modal-overlay hidden">
  <div class="modal-card">
    <header class="modal-header">
      <h2>Kategorien verwalten</h2>
      <button class="close-btn" id="close-categories-btn" type="button">&times;</button>
    </header>
    <div class="form-group">
      <label style="margin-bottom: 8px; display: block; font-weight: 600;">Neue Kategorie hinzufügen</label>
      <input type="text" id="new-category" placeholder="z.B. T-Shirt, Hose, Serien">
      <button class="btn" id="add-category-btn" type="button">Kategorie hinzufügen</button>
    </div>
    <h3 style="margin-top: 24px; margin-bottom: 12px; font-size: 1.1rem; border-bottom: 1px solid #eee; padding-bottom: 6px;">Bestehende Kategorien</h3>
    <div id="category-list" class="category-list"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="supabase-helper.js"></script>
<script src="admin.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', () => {
    const modal = document.getElementById('categories-modal');
    const openBtn = document.getElementById('open-categories-btn');
    const closeBtn = document.getElementById('close-categories-btn');
    if (openBtn && modal) {
      openBtn.addEventListener('click', () => {
        modal.classList.remove('hidden');
      });
    }
    if (closeBtn && modal) {
      closeBtn.addEventListener('click', () => {
        modal.classList.add('hidden');
      });
    }
    if (modal) {
      modal.addEventListener('click', (e) => {
        if (e.target === modal) modal.classList.add('hidden');
      });
    }
  });
</script>
</body>
</html>
